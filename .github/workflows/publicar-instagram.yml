# PAUSADO a proposito: no se publica nada hasta que la app este en la store.
# Deshabilitado desde Actions (disabled_manually), no comentando el cron, para
# que reactivarlo sea un boton: Actions > este workflow > Enable workflow.
name: Publicar serie diaria en Instagram

on:
  schedule:
    # Cada 15 minutos: publicar.py mira la hora de cada post en calendario.json (Europe/Madrid,
    # cambio de hora incluido) y solo publica cuando le toca. GitHub puede retrasar el cron unos minutos.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Id concreto (p. ej. dia-07, guia-clases). Vacio = el de hoy, si ya es su hora."
        required: false
      dry_run:
        description: "Ensayo sin publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          cd automatizacion
          python3 publicar.py \
            ${{ inputs.id && format('--id {0}', inputs.id) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Guardar el registro para no repetir publicacion
        if: inputs.dry_run != true
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- automatizacion/registro.json; then
            echo "sin cambios en el registro"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automatizacion/registro.json
          git commit -m "registro: post publicado $(date -u +%Y-%m-%d)"
          git push
