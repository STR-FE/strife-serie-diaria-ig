# Renueva el token de Instagram (dura 60 dias) sin que salga de GitHub. Instagram alarga el mismo
# token: si devolviera uno distinto, el job falla para avisar de que hay que pegarlo a mano en el secreto.
name: Renovar token de Instagram

on:
  schedule:
    - cron: "0 8 1,20 * *"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          token = os.environ["IG_ACCESS_TOKEN"]
          url = "https://graph.instagram.com/refresh_access_token?" + urllib.parse.urlencode(
              {"grant_type": "ig_refresh_token", "access_token": token})
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  d = json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit("Instagram no renovo el token: " + e.read().decode("utf-8", "replace"))
          caduca = datetime.now(timezone.utc) + timedelta(seconds=int(d["expires_in"]))
          print(f"renovado: caduca el {caduca:%Y-%m-%d} ({int(d['expires_in']) // 86400} dias)")
          if d["access_token"] != token:
              raise SystemExit("Instagram devolvio un token distinto: hay que guardarlo a mano en el secreto IG_ACCESS_TOKEN")
          print("es el mismo token: el secreto sigue valido")
          PY
